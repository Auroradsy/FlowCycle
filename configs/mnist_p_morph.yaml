# FlowCycle on paired synthetic MNIST MRI/PET -- with trajectory regularization (see README for the flags)
#   python train.py --config configs/mnist_p_morph.yaml
# Command-line flags override the values here.
variant: morph
tag: mnist_p_morph

# data ---------------------------------------------------------------------
data: folder
pair: true                # A[i] and B[i] are the same sample; asserted at load
data_root: datasets/mnist_petct_paired
img_ch: 3
load_size: 72             # resize, then random-crop to 64 -- the SAME crop and
crop_size: 64             # flip are applied to both members of a pair
no_flip: true             # a mirrored digit is not a member of either domain
eval_batch: 64
seed: 42
workers: 6

warm: exps/checkpoints/mnist_host/last.pth

# schedule -----------------------------------------------------------------
# Same as the unpaired MNIST runs, so the two differ only in the supervision.
e1: 60
p1: 10
e2: 60
p2: 12
e3: 80
p3: 15
batch: 32
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 6
n_flow: 4
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
w_self: 10.0
w_cross: 10.0             # PAIRED: the spine of stage 2, as on ADNI
w_gan: 1.0
w_cyc: 10.0
w_latcyc: 2.0
w_path_gan: 0.5
w_path_smooth: 1.0
s2_cyc: 0                 # L_cross already gives stage 2 an objective
