# FlowCycle on MNIST-PET/CT — variant "morph"  (round 2, the S3 ablation)
#
# Path supervision.  Driven by run_mnist_s3.sh, which overrides
# --path_gan_mode and --w_path_gan per arm and resumes ALL arms from one shared
# stage-2 checkpoint, so S3 is the only thing that differs between them.
#
#   bash configs/run_mnist_s3.sh
variant: morph
tag: mnist_morph

# data ---------------------------------------------------------------------
data: folder
data_root: /ix/lzhan/siyuan/datasets/processed_datas/MNIST_CycleFlow/mnist_petct
img_ch: 3
load_size: 72
crop_size: 64
no_flip: true
eval_batch: 64
seed: 42
workers: 6

warm: exps/checkpoints/mnist_host/last.pth

# schedule -----------------------------------------------------------------
e1: 60
p1: 10
e2: 60
p2: 12
e3: 80
p3: 15
batch: 32
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 6
n_flow: 4
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
w_self: 10.0
w_cross: 0.0
w_gan: 1.0
w_cyc: 10.0
w_latcyc: 2.0
w_path_gan: 0.5
w_path_smooth: 1.0
path_gan_mode: abs        # run_mnist_s3.sh overrides this per arm
path_critics: shared
path_bidir: 0
s2_cyc: 1
