# FlowCycle on MNIST-PET/CT — variant "base"
#
# Rewiring only. The arm the headline claim rests on.
#
# Why this dataset after horse2zebra: PET is DERIVED from the MNIST image, so a
# ground-truth counterpart exists for every sample, but the train split uses
# disjoint indices between A and B so training never sees a pair.  Unpaired
# training, paired evaluation — which is the one thing horse2zebra could not
# offer, and the reason its endpoint claim stayed unresolved (FID alone, with
# cycle SSIM won by an identity map).
#
# A = CT  = original MNIST, grayscale replicated to RGB.
# B = PET = per-class hotspot boost -> PSF blur -> SUV curve -> green tint.
# The hotspots are a class-conditional signal absent from CT, so A->B must
# INVENT them (right only distributionally) while B->A merely removes them.
# Expect the directions to differ; on horse2zebra they did, unexplained.
#
#   python train.py --config configs/mnist_base.yaml
variant: base
tag: mnist_base

# data ---------------------------------------------------------------------
data: folder
data_root: /ix/lzhan/siyuan/datasets/processed_datas/MNIST_CycleFlow/mnist_petct
img_ch: 3
load_size: 72             # resize, then random-crop to 64 (CycleGAN recipe)
crop_size: 64
no_flip: true             # a mirrored digit is not a member of either domain
eval_batch: 64
seed: 42
workers: 6

warm: exps/checkpoints/mnist_host/last.pth

# schedule -----------------------------------------------------------------
# Not the ADNI schedule.  12000 images/domain at batch 32 is 375 iters/epoch
# against horse2zebra's 133, so an epoch here is ~3x the gradient steps and
# the epoch caps come down to match.  Batch is 32 rather than 8 because 64px
# with 6 resnet blocks leaves the card almost empty at 8.
e1: 60
p1: 10
e2: 60
p2: 12
e3: 80
p3: 15
batch: 32
lr: 2.0e-4
lr_flow: 1.0e-4
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 6               # reference CycleGAN uses resnet_6blocks below 256px
n_flow: 4                 # flow blocks — also the number of morph frames
flow_hidden: 128
pre_relu: 1

# loss weights -------------------------------------------------------------
w_self: 10.0
w_cross: 0.0              # UNPAIRED at train time: no target for the cross paths
w_gan: 1.0
w_cyc: 10.0
w_latcyc: 0.0
w_path_gan: 0.0
w_path_smooth: 0.0
s2_cyc: 1                 # S2 has only the GAN term otherwise
