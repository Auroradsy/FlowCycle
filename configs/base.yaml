# FlowCycle — variant "base"
# Rewiring only. No L_latcyc, no L_path, no D_mix. Best cross-SSIM of the three; its morph changes the T1 view instead of the FA view (tearing).
#
#   python train.py --config configs/base.yaml
#
# Flags typed on the command line override anything here.  The variant presets
# in train.py are applied last, so w_latcyc / w_path_* are pinned by the variant
# regardless of what this file says — they are listed for the record.
variant: base
tag: base

# data --------------------------------------------------------------------
z_lo: 40                  # axial band, inclusive.  40..49 = the "middle 10";
z_hi: 49                  # see: python -m data.build_cache --report
label_scheme: label_4     # CN / EMCI / MCI / LMCI; used only for the split
seed: 42
workers: 4

# warm start ---------------------------------------------------------------
# The plain-CycleGAN checkpoint that gets split into E_A/D_B and E_B/D_A.
# Set to "" to train the host from scratch inside stage 1 instead.
warm: exps/checkpoints/host/last.pth

# schedule: epochs and early-stopping patience per stage --------------------
e1: 120                   # S1  two independent autoencoders   (f frozen = id)
p1: 20
e2: 80                    # S2  the bijection only             (E, D frozen)
p2: 15
e3: 120                   # S3  joint                          (E frozen)
p3: 20
batch: 8
lr: 2.0e-4                # encoders / decoders / discriminators
lr_flow: 1.0e-4           # the flow, deliberately slower
clip: 5.0

# architecture -------------------------------------------------------------
ngf: 64
ndf: 64
n_blocks: 6               # residual blocks per decoder (host default)
n_flow: 4                 # flow blocks — also the number of morph frames
flow_hidden: 128
pre_relu: 1               # tap the bottleneck BEFORE down's last ReLU.
                          # Leave on: feat >= 0 otherwise, and a non-negative
                          # code cannot host a signed flow output.

# loss weights -------------------------------------------------------------
w_self: 10.0              # L1(D_A(z), T1) + L1(D_B(u), FA)
w_cross: 10.0             # L1(D_B(f z), FA) + L1(D_A(f^-1 u), T1)
w_gan: 1.0                # LSGAN against D_T1 / D_FA
w_cyc: 10.0               # pixel cycle T1 -> FA -> T1
w_latcyc: 0.0              # flow output must be a fixed point of the target AE
w_path_gan: 0.0            # intermediate frames must look real to D_mix
w_path_smooth: 0.0         # adjacent frames must be close in pixel space
